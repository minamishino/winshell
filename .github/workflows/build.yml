name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Prepare fixed SSH source
        run: pwsh -NoProfile -File src/WinShell.SshNet.Source/Prepare-Source.ps1
      - name: Prepare fixed native terminal engine
        run: pwsh -NoProfile -File src/WinShell.Terminal.NativeHost/Initialize-StableNativeEngine.ps1
      - name: Prepare fixed portable PowerShell
        run: pwsh -NoProfile -File src/WinShell.Infrastructure.Windows/Terminal/Prepare-PowerShell.ps1
      - name: Restore locked dependencies
        run: dotnet restore WinShell.slnx --locked-mode -p:Platform=x64
      - name: Build Release
        run: dotnet build WinShell.slnx -c Release --no-restore -p:Platform=x64
